# Despliegue en la VPS de FiNet (38.7.201.104), cuenta `grupo3`.
#
# Difiere del docker-compose.yml de desarrollo en tres cosas:
#
#  1. Levanta su propia Postgres. Hasta el 5-11-2026 la base era la de
#     Railway, compartida con los otros grupos; desde que G1 y G8 pasaron
#     cada uno a la suya dentro de la VPS, esa base dejo de ser el lugar
#     comun y G3 tambien corre la propia. Las integraciones no dependen de
#     compartir base: viajan por el webhook de cierre y por los endpoints
#     de /api/integraciones.
#
#  2. Publica en el rango 8300-8399 que nos asignaron, y SOLO en 127.0.0.1.
#     Los cuatro grupos comparten el host: un puerto sin la direccion de
#     loopback queda expuesto a internet, y uno fuera del rango choca con
#     otro grupo. El acceso desde afuera es por tunel SSH, no por el puerto.
#
#  3. Toma DATABASE_URL del entorno en vez de construirla, para poder
#     apuntarla a otra base sin tocar el compose. Lo normal es que apunte al
#     servicio `db` de aca.
#
# Uso:
#   cd /srv/finet/grupo3/Team-3-FSM
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Para verlo desde tu maquina, en otra consola local:
#   ssh -N -L 127.0.0.1:18300:127.0.0.1:8300 grupo3@38.7.201.104
#   y entrar a http://127.0.0.1:18300

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en el .env del servidor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el .env del servidor}
      POSTGRES_DB: ${POSTGRES_DB:-fsm}
    # En el rango asignado y solo en loopback. Publicarla permite que otro
    # grupo de la misma VPS la consulte --como hizo G8 con la suya en el
    # 15432-- sin exponerla a internet.
    ports:
      - '127.0.0.1:8305:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fsm} -d ${POSTGRES_DB:-fsm} -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./fsm/backend
    restart: unless-stopped
    # En la red del host, no en una bridge. Con Docker rootless un contenedor
    # en bridge NO alcanza un puerto atado al 127.0.0.1 del host: ni siquiera
    # con `host.docker.internal`, que resuelve el nombre pero no conecta, y
    # Prisma corta con `P1001: Can't reach database server`. En la red del
    # host si llega, y con eso el backend puede usar cualquier base publicada
    # en el loopback de la VPS: la del servicio `db` de aca o la de otro grupo.
    #
    # El mapeo de `ports` se ignora en esta red, asi que el puerto lo define
    # PORT y la interfaz la acota HOST. El resultado es el mismo que antes
    # --127.0.0.1:8300-- pero lo impone el proceso en vez de Docker.
    network_mode: host
    # Sin esto el backend arranca antes que la base y el `migrate deploy`
    # del arranque falla en el primer intento.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Siempre por 127.0.0.1, que en la red del host es la VPS y no el
      # contenedor. El servicio `db` de aca esta en el 8305; una base de otro
      # grupo, en el puerto que haya publicado (G8 uso el 15432).
      #   postgresql://usuario:clave@127.0.0.1:8305/fsm
      # El nombre de servicio `db` NO sirve aca: en la red del host no hay
      # resolucion por nombre de Docker.
      DATABASE_URL: ${DATABASE_URL:?Definí DATABASE_URL en el .env del servidor}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:18301}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el .env del servidor}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      INTEGRACION_API_KEYS: ${INTEGRACION_API_KEYS:-}
      WIFI_LLAVE_PRIVADA_PEM: ${WIFI_LLAVE_PRIVADA_PEM:-}
      CIERRE_FAN_OUT_MOMENTO: ${CIERRE_FAN_OUT_MOMENTO:-CIERRE}
      CIERRE_WEBHOOK_G1_URL: ${CIERRE_WEBHOOK_G1_URL:-}
      CIERRE_WEBHOOK_G1_KEY: ${CIERRE_WEBHOOK_G1_KEY:-}
      CIERRE_WEBHOOK_G8_URL: ${CIERRE_WEBHOOK_G8_URL:-}
      CIERRE_WEBHOOK_G8_KEY: ${CIERRE_WEBHOOK_G8_KEY:-}
      # Monitoreo de red. Con MONITOREO_FUENTE=smartolt el modulo construye el
      # cliente real y aborta el arranque si le faltan BASE_URL o TOKEN, asi
      # que las tres van juntas o ninguna.
      MONITOREO_FUENTE: ${MONITOREO_FUENTE:-}
      SMARTOLT_BASE_URL: ${SMARTOLT_BASE_URL:-}
      SMARTOLT_API_TOKEN: ${SMARTOLT_API_TOKEN:-}
      SMARTOLT_CSV_PATH: ${SMARTOLT_CSV_PATH:-}
      # Tareas de fondo. Las tres son opt-in (solo el string "true" las prende)
      # y hay que dejarlas APAGADAS mientras Railway siga sirviendo la misma
      # base: dos instancias ingestando duplican el gasto del rate limit de
      # SmartOLT, que es de 15 llamadas/HORA y es compartido con los otros
      # grupos. Prender solo despues de apagar Railway.
      MONITOREO_POLL_ENABLED: ${MONITOREO_POLL_ENABLED:-}
      MONITOREO_POLL_INTERVAL_MS: ${MONITOREO_POLL_INTERVAL_MS:-}
      MONITOREO_PURGA_ENABLED: ${MONITOREO_PURGA_ENABLED:-}
      MONITOREO_TOPOLOGIA_ENABLED: ${MONITOREO_TOPOLOGIA_ENABLED:-}
      # Este es al reves: corre salvo que valga exactamente "false". Con las dos
      # instancias arriba, el cliente recibiria el aviso de mantencion dos veces.
      AVISOS_MANTENCION_ENABLED: ${AVISOS_MANTENCION_ENABLED:-false}
      # Tomodat (planta externa). Sin token el cliente no consulta; la base tiene
      # que ser https:// o la rechaza (ver tomodat.client.ts).
      TOMODAT_BASE_URL: ${TOMODAT_BASE_URL:-}
      TOMODAT_API_TOKEN: ${TOMODAT_API_TOKEN:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Definí SEED_ADMIN_PASSWORD en el .env del servidor}
      # Encendido salvo que valga exactamente "false". Apagarlo SOLO cuando
      # DATABASE_URL apunte a una base que administra otro --por ejemplo
      # `finet_global_validacion`, donde `g3_app` no tiene CREATE en public--:
      # ahi `prisma migrate deploy` falla y el contenedor queda en crash-loop
      # sin llegar nunca a arrancar. Contra la base `db` de aca va encendido.
      MIGRAR_AL_ARRANCAR: ${MIGRAR_AL_ARRANCAR:-true}
      # En la red del host no hay mapeo que acote la escucha: la acota HOST.
      PORT: 8300
      HOST: 127.0.0.1

  frontend:
    build:
      context: ./fsm/frontend
      # Se hornea en el bundle al construir, no es variable de runtime. Si se
      # cambia, hace falta `up -d --build`: sin eso el navegador sigue
      # llamando a la URL vieja y falla por CORS.
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:18300}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ORIGIN: ${FRONTEND_URL:-http://127.0.0.1:18301}
      PORT: 3000
    ports:
      - '127.0.0.1:8301:3000'

volumes:
  datos_postgres:
